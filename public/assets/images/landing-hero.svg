<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e3ed" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e5c7d6" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#fdf6f9" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="noise" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#e0d2dc" opacity="0.3"/>
      <rect x="2" y="1" width="1" height="1" fill="#d4c5d2" opacity="0.35"/>
      <rect x="1" y="3" width="1" height="1" fill="#ccb7c7" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#noise)" opacity="0.45"/>
  <text x="50%" y="50%" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="64" fill="#2d1f29" opacity="0.55">Drop your hero image at /public/assets/images/landing-hero.svg</text>
</svg>
